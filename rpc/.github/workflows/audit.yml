name: Audit

on:
  schedule:
    - cron: '0 9 * * *' # daily at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@c003527eff402d35ff357854a591cbec2935c2c3
    with:
      checks: advisories
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write # files the advisory issue
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@c003527eff402d35ff357854a591cbec2935c2c3
