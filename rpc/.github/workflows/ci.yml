name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test (Workspace)
        run: cargo test --workspace
      - name: Test rpc_driver (No Features)
        run: cargo test -p rpc_driver --no-default-features
      - name: Test (All Features)
        run: cargo test --workspace --all-features
      - name: Check format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
