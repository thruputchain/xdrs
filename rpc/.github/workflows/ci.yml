name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  build-and-test:
    name: Rust 1.96
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      # A consumer must never end up with two incompatible copies of the RPC
      # boundary crates in one build — that is exactly the type-identity
      # split this workspace exists to prevent (see "Versioning and
      # releases" in README.md).
      - name: Check for duplicate RPC boundary crates
        run: |
          DUPES=$(cargo tree --workspace --duplicates --edges normal --locked | grep -E '^(rpc_api|rpc_driver) v' || true)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate RPC boundary crates in the dependency graph:"
            echo "$DUPES"
            cargo tree --workspace --duplicates --edges normal --locked
            exit 1
          fi
          echo "OK: no duplicate rpc_api/rpc_driver in the graph"
      - name: Test (Workspace)
        run: cargo test --workspace --locked
      - name: Check format
        run: cargo fmt --check
      - name: Clippy (Workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  stable-compat:
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v6
      - name: Set up current stable
        uses: dtolnay/rust-toolchain@stable
      - name: Test workspace on current stable
        run: cargo +stable test --workspace --all-features --locked

