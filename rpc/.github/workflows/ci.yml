name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  dependency-policy:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@v1
    with:
      registry-name: groundhog
    secrets:
      registry-token: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}

  workflow-lint:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/workflow-lint.yml@v1
    with:
      shellcheck-scripts: true

  build-and-test:
    needs: dependency-policy # inspect dependencies before anything builds them
    name: Rust 1.96
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy --no-self-update
          rustup default 1.96.0
      # A consumer must never end up with two incompatible copies of the RPC
      # boundary crates in one build — that is exactly the type-identity
      # split this workspace exists to prevent (see "Versioning and
      # releases" in README.md).
      - name: Check for duplicate RPC boundary crates
        run: |
          DUPES=$(cargo tree --workspace --duplicates --edges normal --locked | grep -E '^(rpc_api|rpc_driver) v' || true)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate RPC boundary crates in the dependency graph:"
            echo "$DUPES"
            cargo tree --workspace --duplicates --edges normal --locked
            exit 1
          fi
          echo "OK: no duplicate rpc_api/rpc_driver in the graph"
      - name: Test (Workspace)
        run: cargo test --workspace --locked
      - name: Check format
        run: cargo fmt --check
      - name: Clippy (Workspace)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  stable-compat:
    needs: dependency-policy
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up current stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Test workspace on current stable
        run: cargo +stable test --workspace --all-features --locked

