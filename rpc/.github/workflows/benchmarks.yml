name: RPC Metrics (hog_sched)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metrics:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare source for the cluster
        run: |
          git archive --format=tar.gz --output=rpc-source.tar.gz HEAD
          echo "METRICS_COMMIT_TIME=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Run metrics on an available cluster host
        shell: bash
        run: |
          hog_sched \
            --i="xdr-rpc-metrics-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --key=git_commit --value="$GITHUB_SHA" \
            --key=git_commit_time --value="$METRICS_COMMIT_TIME" \
            --key=cargo_registry_token --value="$CARGO_REGISTRIES_GROUNDHOG_TOKEN" \
            --timeout-sec=3000 \
            ./scripts/schedules/metrics.toml
      - name: Show results
        if: always()
        run: |
          if [ -f benchmark-results/summary.md ]; then
            cat benchmark-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-metrics-${{ github.sha }}-${{ github.run_attempt }}
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 90
