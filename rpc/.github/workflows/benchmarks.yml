name: RPC Metrics (hog_sched)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_evaluation:
        description: Compare main and candidate across the full suite and runtime layouts
        type: boolean
        default: false
      pool_evaluation:
        description: Compare the connection pools against each other on the candidate
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
  CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token

jobs:
  metrics:
    runs-on: self-hosted
    timeout-minutes: 120
    steps:
      # clean up .gitconfig from the previous run of webfactory/ssh-agent
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig
      # add all relevant GitHub deploy keys to the workflow; hog_sched forwards
      # this agent to the cluster host, where hog_fwd maps each key to its repo.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.XDR_RPC_KEY }}
            ${{ secrets.METRICS_HISTORY_WRITE_KEY }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Run hog schedule
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          FULL_EVALUATION: ${{ inputs.full_evaluation || false }}
          POOL_EVALUATION: ${{ inputs.pool_evaluation || false }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "Branch name: $BRANCH_NAME"
          hog_sched \
            --i="${{ github.event.repository.name }}-${{ github.run_id }}" \
            --key=github_repo --value=${{ github.repository }} \
            --key=git_branch --value="$BRANCH_NAME" \
            --key=git_commit --value="$SOURCE_SHA" \
            --key=cargo_registry_token --value=${{ secrets.GROUNDHOG_REGISTRY_TOKEN }} \
            --key=cargo_registry_global_credential_providers --value=${{ env.CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS }} \
            --key=full_evaluation --value="$FULL_EVALUATION" \
            --key=pool_evaluation --value="$POOL_EVALUATION" \
            --timeout-sec=6600 \
            ./scripts/schedules/metrics.toml
