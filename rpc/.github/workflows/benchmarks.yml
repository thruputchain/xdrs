name: Benchmarks

# Disabled: requires GitHub Pages (GitHub Enterprise or public repo).
# To enable, uncomment the trigger and ensure gh-pages branch exists.
# on:
#   push:
#     branches: [main]
on:
  workflow_dispatch: # manual trigger only

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.GROUNDHOG_REGISTRY_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run benchmarks
        run: cargo bench --bench rpc_bench --features concurrent-dispatch -- --gh-bench > bench-output.json
      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: customSmallerIsBetter
          output-file-path: bench-output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          alert-threshold: "150%"
          comment-on-alert: false
          fail-on-alert: false
