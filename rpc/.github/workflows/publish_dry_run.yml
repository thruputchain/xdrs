name: Release dry run checks

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.ACTION_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: groundhogchain/actions
          path: actions
          ref: af074672d3a6f3ddedcacd758224ea5a5cf2a8f3 # v0
          persist-credentials: false

      # Explicit package list, in dependency order: the action packages each
      # listed crate into vendor/ before the next one resolves against it, so
      # rpc_api must precede rpc_driver. Keep in sync with publish.yml.
      - name: publish dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: rpc_api rpc_driver
