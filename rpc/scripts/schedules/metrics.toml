name = "xdr_rpc_metrics"

[[jobs]]
name = "{{ .hog_schedule }}_metrics"
file_in = ["rpc-source.tar.gz"]
file_out = ["benchmark-results"]
script = '''
set -euo pipefail
mkdir -p benchmark-results
# Transfer the exact merged source without forwarding GitHub checkout credentials
# or requiring a new source-repository deploy key on the benchmark host.
tar -xzf rpc-source.tar.gz
export PATH="$HOME/.cargo/bin:$PATH"
python3 scripts/benchmark.py --source-sha "$GIT_COMMIT" \
  --threads 2 --output benchmark-results 2>&1 | tee benchmark-results/run.log
# Publish using the selected cluster host's metrics-history credentials.
python3 scripts/publish_metrics.py --report benchmark-results \
  --commit "$GIT_COMMIT" --commit-time "$GIT_COMMIT_TIME"
'''

[jobs.env]
GIT_COMMIT = "{{ .git_commit }}"
GIT_COMMIT_TIME = "{{ .git_commit_time }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "cargo:token"
CARGO_NET_GIT_FETCH_WITH_CLI = "true"

# Reserve any available cluster host using the scheduler wildcard.
[jobs.host]
metrics_1 = "?"
