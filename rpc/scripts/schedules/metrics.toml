name = "xdr_rpc_metrics"

[[jobs]]
name = "{{ .hog_schedule }}_metrics"
script = '''

set -ex

echo 'cloning xdr_rpc'
git init -q .
git remote add origin git@github.com:{{ .github_repo }}.git
git fetch --depth 1 origin {{ .git_commit }} --no-progress --quiet
git checkout -q {{ .git_commit }}

echo 'setting up cargo'
# hog_sched points HOME at the job directory. Use the host user's rustup and
# cargo homes, as hogd's setup_cargo.sh does by symlinking them, but through
# the environment so the checked-in .cargo/config.toml stays in place.
export RUSTUP_HOME="$USER_HOME/.rustup"
export CARGO_HOME="$USER_HOME/.cargo"
export PATH="$CARGO_HOME/bin:$PATH"
rustup toolchain list
cargo --version

echo 'run metrics'
python3 scripts/benchmark.py --threads 2 --output benchmark-results

if [ "$FULL_EVALUATION" = "true" ]; then
  python3 scripts/evaluate_runtimes.py --output benchmark-results/evaluation
fi

if [ "$POOL_EVALUATION" = "true" ]; then
  python3 scripts/evaluate_pools.py --output benchmark-results/pools
fi

echo 'commit metrics'
python3 scripts/publish_metrics.py --report benchmark-results --branch "$GIT_BRANCH" \
  --commit "$GIT_COMMIT" --commit-time "$(git show -s --format=%ct HEAD)"

'''

[jobs.env]
FULL_EVALUATION = "{{ .full_evaluation }}"
POOL_EVALUATION = "{{ .pool_evaluation }}"
GIT_COMMIT = "{{ .git_commit }}"
GIT_BRANCH = "{{ .git_branch }}"
CARGO_REGISTRIES_GROUNDHOG_TOKEN = "{{ .cargo_registry_token }}"
CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS = "{{ .cargo_registry_global_credential_providers }}"
CARGO_NET_GIT_FETCH_WITH_CLI = "true"

# Reserve any available cluster host using the scheduler wildcard.
[jobs.host]
metrics_1 = "?"
