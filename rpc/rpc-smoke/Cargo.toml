[package]
name = "rpc-smoke"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false

[dependencies]
rpc_driver = { workspace = true, features = ["concurrent-dispatch"] }
tokio = { version = "1.47.1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1.89"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true

[[bin]]
name = "rpc-smoke-server"
path = "src/server.rs"

[[bin]]
name = "rpc-smoke-client"
path = "src/client.rs"

[[bin]]
name = "rpc-smoke"
path = "src/harness.rs"
