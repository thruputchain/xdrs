[package]
name = "rpc_driver"
version = "0.3.1"
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"  
publish = ["groundhog"]
description = "Async ONC-RPC (RFC 5531) client/server library built on tokio."
repository = "https://github.com/groundhogchain/rpc_rs"
homepage = "https://github.com/groundhogchain/rpc_rs"
readme = "../README.md"
keywords = ["xdr", "rpc"]
categories = ["rpc"]

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0"
xdrs = { registry = "groundhog", version = "0.5.0", features = ["derive", "alloc"] }

[[bench]]
name = "rpc_latency"
harness = false
