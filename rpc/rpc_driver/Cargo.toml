[package]
name = "rpc_driver"
version = "0.5.1"
edition = "2024"
authors = ["Groundhog Team"]
license = "Apache-2.0"  
publish = ["groundhog"]
description = "Async ONC-RPC (RFC 5531) client/server library built on tokio."
repository = "https://github.com/groundhogchain/rpc_rs"
homepage = "https://github.com/groundhogchain/rpc_rs"
readme = "../README.md"
keywords = ["xdr", "rpc"]
categories = ["rpc"]

[features]
concurrent-dispatch = []

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0"
xdrs = { registry = "groundhog", version = "0.5.0", features = ["derive", "alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["full", "test-util"] }

[[bench]]
name = "rpc_bench"
harness = false
