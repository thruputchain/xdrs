[package]
name = "rpc_driver"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors = ["Groundhog Team"]
license = "Apache-2.0"
publish = ["groundhog"]
description = "Async ONC-RPC (RFC 5531) client/server library built on tokio."
repository = "https://github.com/groundhogchain/rpc_rs"
homepage = "https://github.com/groundhogchain/rpc_rs"
readme = "../README.md"
keywords = ["xdr", "rpc"]
categories = ["rpc"]

[features]
concurrent-dispatch = []

[dependencies]
rpc_api = { workspace = true }
async-trait = "0.1.89"
socket2 = "0.6"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
xdrs = { registry = "groundhog", version = "0.10.1", features = ["derive", "alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[lints]
workspace = true

[[bench]]
name = "rpc_bench"
harness = false
