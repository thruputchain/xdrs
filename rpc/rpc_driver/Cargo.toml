[package]
name = "thruput-rpc-driver"
# Versioned independently of the workspace, like thruput-rpc-api: the driver
# changes far more often than the xdrs crates, and a driver-only release must
# not publish a new thruput-xdrs. It depends on thruput-xdrs and
# thruput-rpc-api with caret requirements. See "Versioning and releases" in
# the README.
version = "0.18.0"
edition = "2024"
rust-version.workspace = true
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["crates-io"]
description = "Async ONC-RPC (RFC 5531) client/server library built on tokio."
repository = "https://github.com/thruputchain/xdrs"
homepage = "https://github.com/thruputchain/xdrs"
readme = "../README.md"
keywords = ["xdr", "rpc"]
categories = ["network-programming", "asynchronous"]

[dependencies]
thruput-rpc-api = { workspace = true }
async-trait = "0.1.89"
socket2 = "0.6"
tokio = { version = "1.47.1", features = ["full"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
xdrs = { workspace = true, features = ["derive", "alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[lints]
workspace = true

[[bench]]
name = "rpc_bench"
harness = false

[[bench]]
name = "primitives"
harness = false
