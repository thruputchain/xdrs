[package]
name = "thruput-rpc-driver"
version.workspace = true
edition = "2024"
rust-version.workspace = true
authors = ["Thruput Team"]
license = "Apache-2.0"
publish = ["crates-io"]
description = "Async ONC-RPC (RFC 5531) client/server library built on tokio."
repository = "https://github.com/thruputchain/xdrs"
homepage = "https://github.com/thruputchain/xdrs"
readme = "../README.md"
keywords = ["xdr", "rpc"]
categories = ["network-programming", "asynchronous"]

[dependencies]
thruput-rpc-api = { workspace = true }
async-trait = "0.1.89"
socket2 = "0.6"
# Only what the library uses. `full` would also turn on fs, process, signal,
# io-std, parking_lot and the multi-threaded runtime for every crate that
# depends on the driver; tests get those through the dev-dependency below.
tokio = { version = "1.47.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
thiserror = "2.0"
tracing = { version = "0.1", default-features = false, features = ["std"] }
xdrs = { workspace = true, features = ["derive", "alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.47.1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true

[[bench]]
name = "rpc_bench"
harness = false

[[bench]]
name = "primitives"
harness = false
