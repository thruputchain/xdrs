# cargo-deny configuration
#   (advisory, license, source, and duplicate-version policy)
#
#   https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
ignore = []
# Informational advisories (unsound, unmaintained) default to workspace-direct
# dependencies only.
unsound = "all"
unmaintained = "all"
# Inert while we fetch every run; matters only if the DB is cached or
# --offline is used. Default bound is 90 days; measured from the last fetch.
maximum-db-staleness = "P7D"

[licenses]
# Unpublished crates don't need a license
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    # wasi: not implied by the bare Apache-2.0 above.
    "Apache-2.0 WITH LLVM-exception",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
    # memchr, dual-licensed Unlicense OR MIT
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version requirement. Registry wildcards
# stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
    "sparse+https://crates.thruput.network/api/v1/crates/",
]
