# cargo-deny configuration
#   (advisory, license, source, and duplicate-version policy)
#
#   https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# heapless 0.9.3 (2026-11-18 advisories, all fixed in 0.9.4). 0.9.4 was
# published 2026-11-18, so cooldown.toml's 15-day minimum publish age keeps
# it out until 2026-12-03: then run `cargo update -p heapless` and remove
# these entries. None of the affected APIs is used here: xdrs uses only
# heapless::Vec and heapless::String, by reference.
ignore = [
    { id = "RUSTSEC-2026-0574", reason = "heapless < 0.9.4; xdrs never uses sorted_linked_list::FindMutView::pop" },
    { id = "RUSTSEC-2026-0575", reason = "heapless < 0.9.4; xdrs never uses spsc::Spsc::peek" },
    { id = "RUSTSEC-2026-0576", reason = "heapless < 0.9.4; xdrs never uses index_map::IndexMap::truncate" },
    { id = "RUSTSEC-2026-0577", reason = "heapless < 0.9.4; xdrs never uses the affected Deque/HistoryBuf/IndexMap methods or vec::IntoIter (it never consumes a heapless::Vec by value)" },
    { id = "RUSTSEC-2026-0578", reason = "heapless < 0.9.4; xdrs never uses sorted_linked_list::SortedLinkedList::zeroize" },
    { id = "RUSTSEC-2026-0579", reason = "heapless < 0.9.4; xdrs never uses Deque::try_from" },
    { id = "RUSTSEC-2026-0580", reason = "heapless < 0.9.4; xdrs never uses arc_pool, box_pool or object_pool" },
    { id = "RUSTSEC-2026-0581", reason = "heapless < 0.9.4; xdrs never uses deque::Deque::make_contiguous" },
    { id = "RUSTSEC-2026-0582", reason = "heapless < 0.9.4; xdrs never uses index_map::IndexMap::insert" },
]
# Informational advisories (unsound, unmaintained) default to workspace-direct
# dependencies only.
unsound = "all"
unmaintained = "all"
# Inert while we fetch every run; matters only if the DB is cached or
# --offline is used. Default bound is 90 days; measured from the last fetch.
maximum-db-staleness = "P7D"

[licenses]
# Unpublished crates don't need a license
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    # wasi: not implied by the bare Apache-2.0 above.
    "Apache-2.0 WITH LLVM-exception",
    # unicode-ident is (MIT OR Apache-2.0) AND Unicode-3.0
    "Unicode-3.0",
    # memchr, dual-licensed Unlicense OR MIT
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version requirement. Registry wildcards
# stay denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io only: the crates publish there, and crates.io rejects a crate
# that depends on another registry.
allow-registry = [
    "https://github.com/rust-lang/crates.io-index",
]
