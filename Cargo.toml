[workspace]
members = ["xdr-derive"]

[workspace.dependencies]
xdr-derive = { path = "xdr-derive" }

[package]
name = "xdrs"
version = "0.1.0"
edition = "2024"

[lib]
# disable libtest benchmarks, in favor of Criterion
bench = false

[dependencies]
thiserror = { version = "2.0.12", default-features = false }
xdr-derive = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.6.0"
hex = "0.4.3"

[features]
default = ["strict", "derive", "cxs", "txs"]
strict = [] # require minimal encodings when reading
alloc = [] # enable allocating interfaces
extras = [] # include convenient extensions to the spec
derive = ["dep:xdr-derive"] # provide ReadXDR, WriteXDR derive-macros
cxs = [] # include CXS codec
txs = [] # include TXS codec

[[bench]]
name = "simple"
harness = false
