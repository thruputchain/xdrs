[workspace]
members = [
    "xdr-derive",
    "xdr-repr",
    ]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
xdr-derive = { path = "xdr-derive" }
xdr-repr = { path = "xdr-repr" }
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }
thiserror = { version = "2.0.12", default-features = false }

[workspace.lints.rust]
unsafe_code = "allow"

[package]
name = "xdrs"
version.workspace = true
edition.workspace = true

[dependencies]
xdr-derive = { workspace = true, optional = true }
xdr_common = { workspace = true, optional = true }
xdr-repr = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = "0.6.0"
hex = "0.4.3"
xdrs = { path = ".", features = ["derive", "xdr_common"] }

[features]
default = ["strict", "cxs", "txs"]
strict = [] # require minimal encodings when reading
derive = ["dep:xdr-derive"] # provide ReadXDR+WriteXDR derive-macros
ns = ["xdr-repr/ns"]
cxs = [] # include CXS codec
txs = [] # include TXS codec
extras = ["xdr-repr/i128"] # include convenient extensions to the spec
xdr_common = ["dep:xdr_common", "xdr-repr/xdr_common"]
alloc = ["xdr_common/alloc"] # enable allocating interfaces
int128_xdr = []

[lints]
workspace = true

[lib]
doctest = false
bench = false # disable libtest benchmarks, in favor of Criterion

[[bench]]
name = "bench1"
harness = false
required-features = ["alloc", "extras"]
