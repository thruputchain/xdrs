[workspace]
members = [
    "xdr-derive",
    "xdr-repr",
    ]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
xdr-derive = { path = "xdr-derive" }
xdr-repr = { path = "xdr-repr" }
xdr_common = { git = "ssh://git@github.com/groundhogchain/xdr_common.git" }
thiserror = { version = "2.0.12", default-features = false }
pretty_assertions = "1.4.1"

[workspace.lints.rust]
unsafe_code = "allow"

[package]
name = "xdrs"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = { workspace = true }

# Optional dependencies
xdr-derive = { workspace = true, optional = true }
xdr-repr = { workspace = true, optional = true }
xdr_common = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.6.0"
hex = "0.4.3"
pretty_assertions = { workspace = true }

[features]
default = ["strict", "cxs", "txs"]
strict = [] # require minimal encodings when reading
cxs = [] # include CXS codec
txs = [] # include TXS codec
extras = [] # include convenient extensions to the spec
alloc = ["xdr_common?/alloc"] # enable allocating interfaces
int128_xdr = ["xdr-repr?/int128_xdr"] # use alternate encoding for 128-bit ints

# Enable optional dependencies
derive = ["dep:xdr-derive"] # derive-macros XDR, ReadXDR, WriteXDR
repr = ["dep:xdr-repr", "alloc"] # XDR-definition datatypes
xdr_common = ["dep:xdr_common", "xdr-repr/xdr_common"]

# Enable optional features of related dependencies
ns = ["xdr-repr?/ns"]

[lints]
workspace = true

[lib]
doctest = false
bench = false # disable libtest benchmarks, in favor of Criterion

[[bench]]
name = "bench1"
harness = false
required-features = ["alloc", "extras"]

[[test]]
name = "repr"
required-features = ["repr", "alloc", "derive"]

[[test]]
name = "enums"
required-features = ["alloc", "derive"]

[[test]]
name = "structs"
required-features = ["alloc", "derive"]

[[test]]
name = "pointer"
required-features = ["alloc", "derive"]
