[workspace]
members = ["xdr-derive"]

[workspace.dependencies]
xdr-derive = { path = "xdr-derive" }

[package]
name = "xdrs"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.12"
xdr-derive = { workspace = true, optional = true }

[dev-dependencies]
hex = "0.4.3"

[features]
default = ["derive"]
alloc = []
derive = ["dep:xdr-derive"]
