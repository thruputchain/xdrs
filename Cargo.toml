[workspace]
members = [
    "xdr-common",
    "xdr-derive",
    "xdr-repr",
]
exclude = [
    "wasm-size-test",
]

[workspace.package]
version = "0.10.4"
edition = "2024"
rust-version = "1.96"
authors = ["Groundhog Team"]
license = "Apache-2.0"  
publish = ["groundhog"]
description = "XDR Serialization Library"
repository = "https://github.com/thruputchain/xdrs"
homepage = "https://github.com/thruputchain/xdrs"
readme = "README.md"
keywords = ["xdr", "serialization"]
categories = ["data-formats"]

# NOTE: The version must be duplicated here despite workspace.package.version above.
# Cargo requires explicit versions for dependencies when publishing,
# as path specifications are stripped out. Remember to keep this in sync.
[workspace.dependencies]
xdr-derive = { path = "xdr-derive", version = "=0.10.4", registry = "groundhog" }
xdr-repr = { path = "xdr-repr", version = "=0.10.4", registry = "groundhog" }
xdr-common = { path = "xdr-common", version = "=0.10.4", registry = "groundhog" }

pretty_assertions = "1.4.1"
heapless = "0.9.3"

[workspace.lints.rust]
unsafe_code = "allow"

[package]
name = "xdrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

exclude = [
    "rust-toolchain.toml",
    "ci.sh",
]

[dependencies]
xdr-common = { workspace = true }

# Optional dependencies
xdr-derive = { workspace = true, optional = true }
xdr-repr = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.6.0"
hex = "0.4.3"
pretty_assertions = { workspace = true }

[features]
default = ["detailed-errors"]
detailed-errors = [] # retain precise ReadError variants and diagnostic payloads
permissive = [] # relax wire validation: CXS minimal integer encoding + TXS non-zero padding
alloc = ["xdr-common/alloc"] # enable allocating interfaces
int128 = ["xdr-repr?/int128"] # enable de/serialization of i128/u128
serde = ["xdr-common/serde"] # serde support for xdr-common types
schemars = ["xdr-common/schemars"] # schemars JsonSchema support for xdr-common types

# Enable optional dependencies
derive = ["dep:xdr-derive"] # derive-macros XDR, ReadXDR, WriteXDR
repr = ["dep:xdr-repr", "alloc"] # XDR-definition datatypes
heapless = ["dep:heapless", "xdr-repr?/heapless"] # serialization and schema support for types from the `heapless` package

# Enable optional features of related dependencies
ns = ["repr", "xdr-repr/ns"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
doctest = true
bench = false # disable libtest benchmarks, in favor of Criterion

[[bench]]
name = "bench1"
harness = false
required-features = ["alloc", "int128"]

[[test]]
name = "repr"
required-features = ["alloc", "derive", "repr"]

[[test]]
name = "enums"
required-features = ["alloc", "derive"]

[[test]]
name = "structs"
required-features = ["alloc", "derive"]

[[test]]
name = "pointer"
required-features = ["alloc", "derive", "detailed-errors"]

[[test]]
name = "in_place"
required-features = ["alloc", "derive"]

[[test]]
name = "const_writer"
required-features = ["alloc", "derive"]

[[test]]
name = "const_opaque_bounds"
required-features = ["alloc", "derive"]

# Contents additionally gated on cfg(not(feature = "alloc")): non-empty
# VecM/BytesM/StringM values are only const-constructible without alloc.
[[test]]
name = "const_writer_noalloc"
required-features = ["derive"]

[[test]]
name = "const_size_bounds"
required-features = ["derive"]

[[test]]
name = "unchecked_writer"
required-features = ["alloc", "derive"]

[[test]]
name = "borrowed_slices_baseline"
required-features = ["alloc", "derive"]

[[test]]
name = "borrowed_slices"
required-features = ["alloc", "derive"]

[[test]]
name = "borrowed_slices_regression"
required-features = ["alloc", "derive"]

[[test]]
name = "plain_ref"
required-features = ["alloc", "derive"]

[[test]]
name = "unsized_ref"
required-features = ["alloc", "derive"]

[[test]]
name = "encodes_as"
required-features = ["alloc", "derive"]

[[test]]
name = "issue_105_bufwriter_overflow"
required-features = ["alloc"]

[[test]]
name = "vecm_prealloc_dos"
required-features = ["alloc", "detailed-errors"]

# These tests inspect or construct precise ReadError variants. Compact builds
# exercise equivalent malformed inputs through tests/read_errors.rs instead.
[[test]]
name = "arrays"
required-features = ["detailed-errors"]

[[test]]
name = "ints"
required-features = ["detailed-errors"]

[[test]]
name = "leak_detection"
required-features = ["detailed-errors"]

[[test]]
name = "padding"
required-features = ["detailed-errors"]
