[workspace]
members = ["xdr-derive"]

[workspace.dependencies]
xdr-derive = { path = "xdr-derive" }

[package]
name = "xdrs"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = { version = "2.0.12", default-features = false }
xdr-derive = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.6.0"
hex = "0.4.3"

[features]
default = ["alloc", "extras", "derive"]
alloc = []
derive = ["dep:xdr-derive"]
strict = []
extras = []

[[bench]]
name = "simple"
harness = false
