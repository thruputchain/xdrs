[package]
name = "wasm-size-test"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
xdrs = { path = "..", default-features = false, features = ["alloc"] }
lol_alloc = "=0.4.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
