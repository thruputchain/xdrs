[package]
name = "thruput-xdrc-check"
description = "Compiles and tests xdrc's Rust output against this workspace's crates"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["std"]
std = []
serde = ["dep:serde", "xdrs/serde"]

[dependencies]
async-trait = "0.1.89"
schemars = "1"
serde = { version = "1", features = ["derive"], optional = true }
thruput-rpc-api = { workspace = true }
xdr-common = { workspace = true }
xdrs = { workspace = true, features = ["alloc", "derive", "repr", "schemars"] }

[dev-dependencies]
serde_json = "1.0.149"
thruput-xdr-codegen = { path = ".." }
