# zizmor configuration
#   https://docs.zizmor.sh/configuration/

rules:
  # unpinned-uses: The default requires hash-pinning everywhere.

  # HIGH. publish.yml interpolates untrusted-ish input into a run block, the
  # same shape as groundhog-rpc's. Tracked with plan item 1.3.
  template-injection:
    ignore:
      - publish.yml

  # Checkout steps without persist-credentials: false. These jobs push tags
  # and releases.
  artipacked:
    ignore:
      - publish.yml
      - publish_docs.yml
      - publish_dry_run.yml

  # Jobs running with default (write) permissions rather than a permissions:
  # block.
  excessive-permissions:
    ignore:
      - publish_docs.yml
      - publish_dry_run.yml

  # Style: prefers '$/...' over './...' for same-repo actions. Cannot be
  # adopted yet -- actionlint 1.7.12 predates the syntax and rejects it.
  self-repository:
    ignore:
      - publish.yml
      - publish_docs.yml
      - publish_dry_run.yml
