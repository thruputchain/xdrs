name: Benchmarks

# Compares a branch's benchmarks against a base commit on the self-hosted
# `hog1` machine, so the numbers come from real hardware rather than a
# hosted VM.
#
# Two ways to run it:
#   - add the `bench` label to a same-repo PR (pushing to a labeled PR runs
#     it again), which compares the PR head against its base branch;
#   - "Run workflow" on any branch, optionally naming the base ref and a
#     criterion filter.
#
# Both sides run in one job on the same machine, back to back, so the
# comparison is not skewed by machine-to-machine differences. The baseline is
# built from the base commit's library with the head's own `benches/`, so
# benchmarks the branch adds are measured on both sides.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare against
        type: string
        default: main
      filter:
        description: Criterion benchmark filter (regex), empty for all
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # On PRs, only when labeled, and only for same-repo PRs: this runs branch
    # code on a self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: hog1
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Shared by both runs: criterion keeps its baselines under the target
      # directory, so the comparison needs the same one for both sides.
      CARGO_TARGET_DIR: ${{ runner.temp }}/bench-target
      BASE_TREE: ${{ runner.temp }}/bench-base
      BENCH_FILTER: ${{ inputs.filter }}

    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0

      - name: Resolve base commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            git fetch --no-tags origin "$INPUT_BASE"
            base="$(git rev-parse FETCH_HEAD)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "Comparing $(git rev-parse --short HEAD) against base $(git rev-parse --short "$base")"

      - name: Prepare baseline tree
        run: |
          git worktree prune
          rm -rf "$BASE_TREE"
          git worktree add "$BASE_TREE" "$BASE_SHA"
          rm -rf "$BASE_TREE/benches"
          cp -r benches "$BASE_TREE/benches"

      - name: Bench baseline
        working-directory: ${{ env.BASE_TREE }}
        run: |
          cargo bench --bench bench1 --all-features -- \
            --save-baseline base --noplot "$BENCH_FILTER"

      - name: Bench head
        run: |
          set -o pipefail
          cargo bench --bench bench1 --all-features -- \
            --baseline base --noplot "$BENCH_FILTER" \
            | tee "$RUNNER_TEMP/bench.txt"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Benchmarks: $(git rev-parse --short HEAD) vs base ${BASE_SHA:0:7} on $(hostname)"
            echo
            echo '```'
            # One line per benchmark: name, head time, change vs base, verdict.
            awk '
              /^[A-Za-z].*\// && !/^Benchmarking/ { name = $1; next }
              /^ +time:/ && name != "" && !inchange { t = $0; sub(/^ +time: +/, "", t); next }
              /change:/ { inchange = 1; next }
              inchange && /time:/ { c = $0; sub(/^ +time: +/, "", c); next }
              inchange && /(improved|regressed|No change|within noise)/ {
                v = $0; sub(/^ +/, "", v)
                printf "%-50s %-36s %-48s %s\n", name, t, c, v
                name = ""; inchange = 0
              }
            ' "$RUNNER_TEMP/bench.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion
          path: ${{ env.CARGO_TARGET_DIR }}/criterion
          if-no-files-found: ignore

      - name: Remove baseline tree
        if: always()
        run: git worktree remove --force "$BASE_TREE" || true
