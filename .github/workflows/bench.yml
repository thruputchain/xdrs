name: Benchmarks (hog_sched)

# Compares a branch's benchmarks against a base commit on the hog cluster, so
# the numbers come from real hardware rather than a hosted VM.
#
# The job itself only drives `hog_sched`, which leases one hog host and runs
# scripts/schedules/bench.toml there: build the base commit and the head
# commit, bench them back to back on that machine, and print a per-benchmark
# comparison. Going through hog_sched keeps this from colliding with the other
# hog_sched jobs that share those hosts.
#
# Two ways to run it:
#   - add the `bench` label to a same-repo PR (pushing to a labeled PR runs
#     it again), which compares the PR head against its base branch;
#   - "Run workflow" on any branch, optionally naming the base ref and a
#     criterion filter.
#
# The baseline is built from the base commit's library with the head's own
# `benches/`, so benchmarks the branch adds are measured on both sides.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base ref to compare against
        type: string
        default: main
      filter:
        description: Criterion benchmark filter (regex), empty for all
        type: string
        default: ""
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # On PRs, only when labeled, and only for same-repo PRs: this runs branch
    # code on the hog cluster.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      BENCH_FILTER: ${{ inputs.filter }}

    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve base commit
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          else
            git fetch --no-tags origin "$INPUT_BASE"
            base="$(git rev-parse FETCH_HEAD)"
          fi
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          echo "Comparing $(git rev-parse --short HEAD) against base $(git rev-parse --short "$base")"

      - name: Run hog schedule
        env:
          # The job's own token: read access to this repository for as long
          # as the job runs, which covers the hog_sched job below.
          GIT_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SCHEDULE_ID: ${{ github.event.repository.name }}-${{ github.run_id }}
        run: |
          set -o pipefail
          # hog_sched forwards the job's ssh-agent to the hog host. The clone
          # there uses the HTTPS token rewrite, so the agent holds no keys; it
          # only needs to exist.
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null' EXIT
          # The token must not reach the job log.
          set +x
          hog_sched \
            --i="$SCHEDULE_ID" \
            --key=github_repo --value="$REPO" \
            --key=git_token --value="$GIT_TOKEN" \
            --key=git_commit --value="$HEAD_SHA" \
            --key=base_commit --value="$BASE_SHA" \
            --key=bench_filter --value="$BENCH_FILTER" \
            --timeout-sec=5400 \
            ./scripts/schedules/bench.toml \
            | tee "$RUNNER_TEMP/bench.txt"

      - name: Summarize
        if: always()
        run: |
          {
            echo "## Benchmarks: $(git rev-parse --short HEAD) vs base ${BASE_SHA:0:7}"
            echo
            echo '```'
            # The schedule prints the comparison between these markers.
            sed -n '/=== BENCH SUMMARY ===/,/=== END BENCH SUMMARY ===/p' \
              "$RUNNER_TEMP/bench.txt" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
