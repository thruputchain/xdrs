# Manual, idempotent docs (re)generation for a given released version.
#
# Normal releases publish docs automatically via the inline "publish docs" step
# in publish.yml. Use this workflow to rebuild docs for an already-tagged version
# (e.g. if a publish-time docs build broke). It checks out the tag, asserts it,
# and re-uploads with force, so it's safe to run any number of times.
name: Publish docs

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)generate docs for, e.g. 0.5.8'
        required: true
      packages:
        description: 'Optional space-separated package list (default: all publishable)'
        required: false
        default: ''

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read

jobs:
  publish-docs:
    runs-on: hog1
    permissions:
      contents: read
    steps:
      - name: Clean up .gitconfig
        run: rm -f /home/hogci/.gitconfig

      - name: Checkout at tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build and publish docs
        uses: thruputchain/actions/cargo-doc@21f8d7cd8b80908dca701ac9dc8efd89798da085
        with:
          version: ${{ inputs.version }}
          packages: ${{ inputs.packages }}
          registry-name: groundhog
          registry-token: ${{ secrets.CARGO_PUBLISH_TOKEN }}
          toolchain: nightly-2026-05-26
          force: 'true'
          expected-tag: v${{ inputs.version }}
