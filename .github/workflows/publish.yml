name: Release package

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run publish checks only; skip tagging, publishing and docs'
        type: boolean
        default: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    xdr-common
    xdr-derive
    xdr-repr
    xdrs

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the version tag
    runs-on: namespace-profile-hogd-linux-2604
    env:
      # Plain Cargo calls in the dry-run action need registry authentication too.
      CARGO_REGISTRIES_GROUNDHOG_TOKEN: ${{ secrets.CARGO_PUBLISH_TOKEN }}
      CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS: cargo:token
    outputs:
      tag: ${{ steps.publish-tag.outputs.tag }}
      version: ${{ steps.publish-tag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Tags are needed so the version tag step sees existing releases.
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0

      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      - name: dry run
        uses: thruputchain/actions/cargo-publish-dry-run@21f8d7cd8b80908dca701ac9dc8efd89798da085
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset
          registry-name: groundhog

      - name: tag commit with version
        if: ${{ !inputs.dry-run }}
        id: publish-tag
        uses: thruputchain/actions/cargo-version-tag@21f8d7cd8b80908dca701ac9dc8efd89798da085
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: push tag
        if: ${{ !inputs.dry-run }}
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          git remote set-url origin "https://$ACTOR:$TOKEN@github.com/$REPOSITORY.git"
          LOCAL_COMMIT=$(git rev-parse "$TAG^{commit}")
          REMOTE_TAG_REF=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$REMOTE_TAG_REF" ]; then
            if [ "$REMOTE_TAG_REF" = "$LOCAL_COMMIT" ]; then
              echo "Tag $TAG already exists on remote at $LOCAL_COMMIT. Skipping push."
            else
              echo "Error: tag $TAG exists on remote at a different commit."
              echo "Remote: $REMOTE_TAG_REF"
              echo "Local: $LOCAL_COMMIT"
              exit 1
            fi
          else
            git push origin "$TAG"
          fi
          git remote set-url origin "https://github.com/$REPOSITORY.git"

      - name: publish
        if: ${{ !inputs.dry-run }}
        uses: thruputchain/actions/cargo-publish@21f8d7cd8b80908dca701ac9dc8efd89798da085
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: groundhog
          registry-token: ${{ secrets.CARGO_PUBLISH_TOKEN }}

  # Build and upload rustdoc to groundhog.dev/docs, after the crates publish.
  # The cargo-doc action writes into the docs site on the self-hosted runner's
  # filesystem, so this job stays on hog1.
  docs:
    needs: publish
    if: ${{ !inputs.dry-run }}
    permissions:
      contents: read
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
          echo "Cleaning up .gitconfig"
          rm -f /home/hogci/.gitconfig

      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          persist-credentials: false

      # HEAD is the freshly-tagged commit, so expected-tag validates cleanly.
      - name: publish docs
        uses: thruputchain/actions/cargo-doc@21f8d7cd8b80908dca701ac9dc8efd89798da085
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          version: ${{ needs.publish.outputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.CARGO_PUBLISH_TOKEN }}
          toolchain: nightly-2026-05-26
          force: 'true'
          expected-tag: ${{ needs.publish.outputs.tag }}
