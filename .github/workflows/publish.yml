# Releases every published crate in this repository to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions.
#
# The crates release as four groups, in dependency order. The first three
# are stable boundary crates (see "Versioning and releases" in the README):
# each versions independently of the workspace, releases under its own tag,
# and is skipped when a release doesn't bump it (and its package is unchanged
# since its tag).
#
#   1. `thruput-rpc-api` (library `rpc_api`): the RPC sender/handler traits
#      and shared response/error types, tagged `rpc_api-v<version>`.
#   2. `thruput-xdr-common`: `VecM`/`BytesM`/`StringM`, tagged
#      `xdr_common-v<version>`.
#   3. `thruput-xdrs-core`: the XDR traits, reader/writer interfaces and
#      const size bounds, tagged `xdrs_core-v<version>`. Depends on 2.
#   4. The workspace-versioned crates, `thruput-xdr-derive`,
#      `thruput-xdr-repr`, `thruput-xdrs` and `thruput-rpc-driver`, under the
#      shared `v<version>` tag. `thruput-xdrs` depends on the published 2 and
#      3; `thruput-rpc-driver` depends on the published `thruput-xdrs` and
#      `thruput-rpc-api`, so it goes last.
#
# Nothing is tagged until the dry run and both groups' checks pass, so a run
# that fails before tagging leaves the repository untouched. Publishing skips
# versions crates.io already has, so a run that fails partway is resumed by
# dispatching it again on the tagged commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. The job runs
# in the `release` environment, and every crate's trusted publisher requires
# it, so only runs that environment's protection rules admit can publish.
# Creating a crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io
# API token with the scopes publish-new, trusted-publishing and
# change-owners; keep it a secret of `release`, not of the repository. The
# publish step registers this workflow, in that environment, as each new
# crate's trusted publisher and adds CRATE_OWNERS as its owners, so remove
# the secret and revoke the token once every crate exists.
#
# Dispatch with dry_run for the dry run and the checks, with no tagging or
# publishing.
name: Release package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no tag/publish)'
        required: false
        type: boolean
        default: false

# Two concurrent releases would race on tags and registry state; queue them.
concurrency:
  group: publish

env:
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # The stable boundary crates: each versioned independently of the
  # workspace and published under its own `<prefix>-v<version>` tag.
  API_PACKAGES: thruput-rpc-api
  COMMON_PACKAGES: thruput-xdr-common
  CORE_PACKAGES: thruput-xdrs-core
  # Workspace-versioned crates published under the `v<version>` tag, in
  # dependency order.
  PRIMARY_PACKAGES: >-
    thruput-xdr-derive
    thruput-xdr-repr
    thruput-xdrs
    thruput-rpc-driver

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the release tags
      id-token: write # crates.io trusted publishing
    environment: release
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      # No persisted credentials: the tag action pushes with github.token
      # itself. Full history brings every tag, which the checks read.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0

      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # Verifies every crate offline, in dependency order: the action
      # packages each listed crate into vendor/ before the next one resolves
      # against it, so thruput-xdr-common and thruput-xdrs-core must precede
      # thruput-xdrs, and thruput-rpc-api and thruput-xdrs must precede
      # thruput-rpc-driver.
      - name: Publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }} ${{ env.COMMON_PACKAGES }} ${{ env.CORE_PACKAGES }} ${{ env.PRIMARY_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset
          registry-name: crates-io

      # Every group's checks run before anything is tagged. A boundary
      # crate's tag legitimately sits on an older commit when a release
      # doesn't bump it: skip-if-published then reports release=false,
      # provided the version is on crates.io and its package is unchanged
      # since the tag.
      - name: Check thruput-rpc-api release
        id: check-api
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-xdr-common release
        id: check-common
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.COMMON_PACKAGES }}
          tag-prefix: 'xdr_common-v'
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-xdrs-core release
        id: check-core
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.CORE_PACKAGES }}
          tag-prefix: 'xdrs_core-v'
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      # `v<version>` must be free or already on HEAD: a new commit needs a
      # version bump.
      - name: Check workspace crates release
        id: check-primary
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.PRIMARY_PACKAGES }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Tag thruput-rpc-api
        id: tag-api
        if: ${{ inputs.dry_run == false && steps.check-api.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-xdr-common
        id: tag-common
        if: ${{ inputs.dry_run == false && steps.check-common.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.COMMON_PACKAGES }}
          tag-prefix: 'xdr_common-v'
          github-token: ${{ github.token }}

      - name: Tag thruput-xdrs-core
        id: tag-core
        if: ${{ inputs.dry_run == false && steps.check-core.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.CORE_PACKAGES }}
          tag-prefix: 'xdrs_core-v'
          github-token: ${{ github.token }}

      - name: Tag workspace crates
        id: tag-primary
        if: ${{ inputs.dry_run == false && steps.check-primary.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PRIMARY_PACKAGES }}
          github-token: ${{ github.token }}

      # Unlike the dry run, publishing resolves deps against crates.io, hence
      # the order: the boundary crates must be live before thruput-xdrs's
      # publish-time verify build, and thruput-xdrs before thruput-rpc-driver's.
      - name: Publish thruput-rpc-api
        if: ${{ inputs.dry_run == false && steps.check-api.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          git-tag: ${{ steps.tag-api.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Publish thruput-xdr-common
        if: ${{ inputs.dry_run == false && steps.check-common.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.COMMON_PACKAGES }}
          tag-prefix: 'xdr_common-v'
          git-tag: ${{ steps.tag-common.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Publish thruput-xdrs-core
        if: ${{ inputs.dry_run == false && steps.check-core.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.CORE_PACKAGES }}
          tag-prefix: 'xdrs_core-v'
          git-tag: ${{ steps.tag-core.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Publish workspace crates
        if: ${{ inputs.dry_run == false && steps.check-primary.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.PRIMARY_PACKAGES }}
          git-tag: ${{ steps.tag-primary.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}
