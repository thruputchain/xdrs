name: Release package

on:
  workflow_dispatch:

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PUBLISH_PACKAGES: >-
    xdr-common
    xdr-derive
    xdr-repr
    xdrs

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
    runs-on: hog1

    steps:
      - name: Clean up .gitconfig
        run: |
            echo "Cleaning up .gitconfig"
            rm -f /home/hogci/.gitconfig

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: |
            ${{ secrets.XDRS_TO_ACTIONS_KEY }}

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Configure git to use SSH
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Checkout actions repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: groundhogchain/actions
          path: actions
          ref: main
          persist-credentials: false

      - name: dry run
        uses: ./actions/cargo-publish-dry-run
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset

      - name: tag commit with version
        id: publish-tag
        uses: ./actions/cargo-version-tag
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}

      - name: push tag
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.publish-tag.outputs.tag }}
        run: |
          git remote set-url origin "https://${ACTOR}:${TOKEN}@github.com/${REPO}.git"
          git push origin "$TAG"
          git remote set-url origin "git@github.com:${REPO}.git"

      - name: publish
        uses: ./actions/cargo-publish
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          git-tag: ${{ steps.publish-tag.outputs.tag }}
          registry-name: groundhog
          registry-token: ${{ secrets.CARGO_PUBLISH_TOKEN }}

      # Build and upload rustdoc to groundhog.dev/docs, after the crates publish.
      # HEAD is the freshly-tagged commit, so expected-tag validates cleanly.
      - name: publish docs
        uses: ./actions/cargo-doc
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          version: ${{ steps.publish-tag.outputs.version }}
          registry-name: groundhog
          registry-token: ${{ secrets.CARGO_PUBLISH_TOKEN }}
          toolchain: nightly-2026-05-26
          force: 'true'
          expected-tag: ${{ steps.publish-tag.outputs.tag }}
