# Releases every published crate in this repository to crates.io in one
# idempotent pass, with the shared thruputchain/actions release actions.
#
# The crates release as three groups, each with its own version and tag, in
# dependency order:
#
#   1. `thruput-rpc-api` (library `rpc_api`): the stable API boundary crate
#      (sender/handler traits and shared response/error types), tagged
#      `rpc_api-v<version>`.
#   2. The workspace-versioned crates, `thruput-xdr-common`,
#      `thruput-xdr-derive`, `thruput-xdr-repr` and `thruput-xdrs`, under the
#      shared `v<version>` tag.
#   3. `thruput-rpc-driver`, tagged `rpc_driver-v<version>`. It depends on
#      the published `thruput-xdrs` and `thruput-rpc-api`, so it goes last.
#
# A run releases whichever groups were bumped. A group whose tag already
# sits on an older commit is skipped, provided its version is on crates.io
# and its package is unchanged since the tag; a group that changed without a
# version bump fails the run. Each group's version bump is checked against
# its own previous release with cargo-semver-checks, so a patch bump that
# breaks the API fails the run too (see "Versioning and releases" in the
# README).
#
# Nothing is tagged until the semver checks, the dry run and every group's
# checks pass, so a run that fails before tagging leaves the repository
# untouched. Publishing skips
# versions crates.io already has, so a run that fails partway is resumed by
# dispatching it again on the tagged commit.
#
# Authentication: crates.io trusted publishing (GitHub OIDC) for existing
# crates; see crates-io-publish's README in thruputchain/actions. The job runs
# in the `release` environment, and every crate's trusted publisher requires
# it, so only runs that environment's protection rules admit can publish.
# Creating a crate needs the CRATESIO_CREATE_PACKAGE_TOKEN secret, a crates.io
# API token with the scopes publish-new, trusted-publishing and
# change-owners; keep it a secret of `release`, not of the repository. The
# publish step registers this workflow, in that environment, as each new
# crate's trusted publisher and adds CRATE_OWNERS as its owners, so remove
# the secret and revoke the token once every crate exists.
#
# Dispatch with dry_run for the dry run and the checks, with no tagging or
# publishing.
name: Release package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no tag/publish)'
        required: false
        type: boolean
        default: false

# Two concurrent releases would race on tags and registry state; queue them.
concurrency:
  group: publish

env:
  # Owners added to each crate a run creates, besides the token's owner.
  CRATE_OWNERS: github:thruputchain:core-maintainers
  # The stable API boundary crate: versioned independently of the workspace,
  # published under its own `rpc_api-v<version>` tag.
  API_PACKAGES: thruput-rpc-api
  # Workspace-versioned crates published under the `v<version>` tag, in
  # dependency order.
  PRIMARY_PACKAGES: >-
    thruput-xdr-common
    thruput-xdr-derive
    thruput-xdr-repr
    thruput-xdrs
  # Versioned independently of the workspace, published under its own
  # `rpc_driver-v<version>` tag.
  DRIVER_PACKAGES: thruput-rpc-driver
  # Pinned so a new lint release can't fail a release without a repo change.
  SEMVER_CHECKS_VERSION: '0.50.0'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write # pushes the release tags
      id-token: write # crates.io trusted publishing
    environment: release
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      # No persisted credentials: the tag action pushes with github.token
      # itself. Full history brings every tag, which the checks read.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0

      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # Each group's version against its own previous release (the nearest
      # tag with its prefix): the bump must be large enough for the API
      # changes since then. A group with no release tag yet is skipped with a
      # notice. These must run before the dry run, which extracts every crate
      # into ./vendor/, where cargo-semver-checks would see each package
      # defined twice; and before tagging, after which the baseline would be
      # the new tag itself.
      - name: Semver check (workspace crates)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PRIMARY_PACKAGES }}
          tag-pattern: 'v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      - name: Semver check (thruput-rpc-api)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }}
          tag-pattern: 'rpc_api-v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      - name: Semver check (thruput-rpc-driver)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.DRIVER_PACKAGES }}
          tag-pattern: 'rpc_driver-v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      # Verifies every crate offline, in dependency order: the action
      # packages each listed crate into vendor/ before the next one resolves
      # against it, so thruput-rpc-api and thruput-xdrs must precede
      # thruput-rpc-driver.
      - name: Publish dry run
        uses: thruputchain/actions/cargo-publish-dry-run@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }} ${{ env.PRIMARY_PACKAGES }} ${{ env.DRIVER_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset
          registry-name: crates-io

      # Every group's check runs before anything is tagged. A group's tag
      # legitimately sits on an older commit when a release doesn't bump it:
      # skip-if-published then reports release=false, provided the version is
      # on crates.io and its package is unchanged since the tag. A package
      # that changed without a version bump fails the check.
      - name: Check thruput-rpc-api release
        id: check-api
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check workspace crates release
        id: check-primary
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.PRIMARY_PACKAGES }}
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Check thruput-rpc-driver release
        id: check-driver
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: check
          packages: ${{ env.DRIVER_PACKAGES }}
          tag-prefix: 'rpc_driver-v'
          on-existing-tag: skip-if-published
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}

      - name: Tag thruput-rpc-api
        id: tag-api
        if: ${{ inputs.dry_run == false && steps.check-api.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          github-token: ${{ github.token }}

      - name: Tag workspace crates
        id: tag-primary
        if: ${{ inputs.dry_run == false && steps.check-primary.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PRIMARY_PACKAGES }}
          github-token: ${{ github.token }}

      - name: Tag thruput-rpc-driver
        id: tag-driver
        if: ${{ inputs.dry_run == false && steps.check-driver.outputs.release == 'true' }}
        uses: thruputchain/actions/cargo-release-tag@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.DRIVER_PACKAGES }}
          tag-prefix: 'rpc_driver-v'
          github-token: ${{ github.token }}

      # Unlike the dry run, publishing resolves deps against crates.io, hence
      # the order: thruput-rpc-api and the xdrs crates must be live before
      # thruput-rpc-driver's publish-time verify build.
      - name: Publish thruput-rpc-api
        if: ${{ inputs.dry_run == false && steps.check-api.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.API_PACKAGES }}
          tag-prefix: 'rpc_api-v'
          git-tag: ${{ steps.tag-api.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Publish workspace crates
        if: ${{ inputs.dry_run == false && steps.check-primary.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.PRIMARY_PACKAGES }}
          git-tag: ${{ steps.tag-primary.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}

      - name: Publish thruput-rpc-driver
        if: ${{ inputs.dry_run == false && steps.check-driver.outputs.release == 'true' }}
        uses: thruputchain/actions/crates-io-publish@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          mode: publish
          packages: ${{ env.DRIVER_PACKAGES }}
          tag-prefix: 'rpc_driver-v'
          git-tag: ${{ steps.tag-driver.outputs.tag }}
          bootstrap-token: ${{ secrets.CRATESIO_CREATE_PACKAGE_TOKEN }}
          crate-owners: ${{ env.CRATE_OWNERS }}
