name: Security audit

# Check once per day for dependency advisories that appear between pushes.
#
# (This needs no checkout: it talks only to the REST API.)

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch: {}

jobs:
  scan:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51
    with:
      checks: advisories

  notify:
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: groundhogchain/actions/.github/workflows/rust-advisory-issue.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51
