name: Security audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  # Run on a schedule so newly-disclosed advisories against already-locked
  # dependencies are caught even when nothing in the repo changes.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # We install and run cargo-audit directly rather than via
      # rustsec/audit-check, because that action builds cargo-audit with an
      # *unlocked* `cargo install`. That pulls the latest `kstring` (MSRV
      # rustc 1.96), which the runner's preinstalled 1.95 toolchain cannot
      # build, and the action exposes no way to pass `--locked`. `--locked`
      # uses cargo-audit's own pinned, MSRV-compatible Cargo.lock, which
      # builds on the preinstalled toolchain.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: cargo audit
