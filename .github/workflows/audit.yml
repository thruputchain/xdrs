# Check once per day for dependency advisories that appear between pushes.
#
# (This needs no checkout: it talks only to the REST API.)
name: Rust dependency audit

on:
  schedule:
    - cron: '45 7 * * *' # Every day at 7:45 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    name: Check dependency policy
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6
    with:
      checks: advisories

  notify:
    name: Report dependency problem
    needs: scan
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6
