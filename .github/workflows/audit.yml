name: Security audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  # Run on a schedule so newly-disclosed advisories against already-locked
  # dependencies are caught even when nothing in the repo changes.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # rustsec/audit-check opens an issue when an advisory is found
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
