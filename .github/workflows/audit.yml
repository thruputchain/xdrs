name: Security audit

on:
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  # Run on a schedule so newly-disclosed advisories against already-locked
  # dependencies are caught even when nothing in the repo changes.
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # rustsec/audit-check opens an issue when an advisory is found
    steps:
      - uses: actions/checkout@v5
      # rustsec/audit-check builds cargo-audit with an unlocked `cargo install`.
      # Keep that build on the repository's supported Rust baseline too.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      # The latest release (v2.0.0) still targets the deprecated Node 20. Pin
      # to the Node 24 commit (rustsec/audit-check#48) — v2.0.0 plus that
      # runtime bump and two README fixes — until a Node 24 release is tagged.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        env:
          RUSTUP_TOOLCHAIN: 1.96.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
