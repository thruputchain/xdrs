name: Release dry run checks

on:
  workflow_dispatch:

env:
  # Dependency order: the action packages each listed crate into vendor/
  # before the next one resolves against it. Keep in sync with publish.yml.
  PUBLISH_PACKAGES: >-
    thruput-rpc-api
    thruput-xdr-common
    thruput-xdr-derive
    thruput-xdr-repr
    thruput-xdrs
    thruput-rpc-driver
  # The release groups, as in publish.yml.
  API_PACKAGES: thruput-rpc-api
  PRIMARY_PACKAGES: >-
    thruput-xdr-common
    thruput-xdr-derive
    thruput-xdr-repr
    thruput-xdrs
  DRIVER_PACKAGES: thruput-rpc-driver
  SEMVER_CHECKS_VERSION: '0.50.0'

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
    runs-on: namespace-profile-hogd-linux-2604

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          # Full history and tags: each semver baseline is a release tag.
          fetch-depth: 0

      - name: Install rustup if needed
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused \
              --location --silent --show-error --fail https://sh.rustup.rs \
              | sh -s -- --default-toolchain none --profile minimal -y
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update
          rustup default 1.96.0

      - name: Install cargo-hack
        env:
          CARGO_HACK_VERSION: '0.6.45'
        run: |
          source "$HOME/.cargo/env"
          if [ "$(cargo hack --version 2>/dev/null | awk '{print $2}')" != "$CARGO_HACK_VERSION" ]; then
            cargo install cargo-hack --version "=$CARGO_HACK_VERSION" --locked
          fi
          cargo hack --version

      # As in publish.yml: each group against its own previous release, before
      # the dry run fills ./vendor/.
      - name: Semver check (workspace crates)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PRIMARY_PACKAGES }}
          tag-pattern: 'v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      - name: Semver check (thruput-rpc-api)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.API_PACKAGES }}
          tag-pattern: 'rpc_api-v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      - name: Semver check (thruput-rpc-driver)
        uses: thruputchain/actions/cargo-semver-checks@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.DRIVER_PACKAGES }}
          tag-pattern: 'rpc_driver-v[0-9]*.[0-9]*.[0-9]*'
          semver-checks-version: ${{ env.SEMVER_CHECKS_VERSION }}

      - name: dry run
        uses: thruputchain/actions/cargo-publish-dry-run@484be875e4e630d26594110bcc0ab6bf42eeaba7
        with:
          packages: ${{ env.PUBLISH_PACKAGES }}
          cargo-hack-feature-options: --feature-powerset
          registry-name: crates-io
