name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-05-26
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo +nightly-2026-05-26 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure library and generated code
        run: bash scripts/coverage.sh
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          if-no-files-found: error
