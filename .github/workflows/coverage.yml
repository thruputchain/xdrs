name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Rust nightly-2026-05-26
        run: |
          rustup toolchain install nightly-2026-05-26 --profile minimal --component llvm-tools-preview --no-self-update
          rustup default nightly-2026-05-26
      - name: Install cargo-llvm-cov
        run: cargo +nightly-2026-05-26 install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure library and generated code
        run: bash scripts/coverage.sh
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            target/llvm-cov/html
            target/llvm-cov/lcov.info
          if-no-files-found: error
