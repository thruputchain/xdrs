name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --check --all

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - ""
          - "alloc"
          - "std"
          - "alloc,std"
          - "serde"
          - "serde,std"
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Set cache key
        id: cache-key
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            FEATURES_KEY="none"
          else
            FEATURES_KEY=$(echo "${{ matrix.features }}" | tr ',' '-')
          fi
          echo "key=$FEATURES_KEY" >> $GITHUB_OUTPUT
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.cache-key.outputs.key }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ steps.cache-key.outputs.key }}-
            ${{ runner.os }}-cargo-
      
      - name: Build
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo build --verbose
          else
            cargo build --verbose --features "${{ matrix.features }}"
          fi
      
      - name: Check
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo check --verbose
          else
            cargo check --verbose --features "${{ matrix.features }}"
          fi

