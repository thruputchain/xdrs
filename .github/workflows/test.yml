name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Test (root lib without alloc)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F xdr_common,int128,int128_xdr
      - name: Test (feature permissive)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F permissive,int128 --test ints
      - name: Test (feature int128)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F int128 --test ints
      - name: Test (workspace)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --workspace --all-features
      - name: Test (benchmarks)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --benches --all-features
      - name: Docs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo doc --workspace --all-features
      - name: Docs (docsrs)
        run: cargo +nightly doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
      - name: Test (xdr-common)
        run: |
          cargo test -p xdr-common --no-default-features
          cargo test -p xdr-common --features alloc
          cargo test -p xdr-common --features std
          cargo test -p xdr-common --features alloc,std
          cargo test -p xdr-common --features serde
          cargo test -p xdr-common --features serde,std
      - name: Test (xdr-common, build-std)
        run: |
          cargo +nightly test -p xdr-common --no-default-features -Zbuild-std=core,alloc
          cargo +nightly test -p xdr-common --features alloc -Zbuild-std=core,alloc
          cargo +nightly test -p xdr-common --features std -Zbuild-std=core,alloc
          cargo +nightly test -p xdr-common --features alloc,std -Zbuild-std=core,alloc
          cargo +nightly test -p xdr-common --features serde -Zbuild-std=core,alloc
          cargo +nightly test -p xdr-common --features serde,std -Zbuild-std=core,alloc
      - name: Test Documentation Examples
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc -p xdr-repr --features "derive,xdr_common,ns,int128_xdr"
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc --features "alloc,derive,repr,xdr_common,ns,int128"
