name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Test (root lib without alloc)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F xdr_common
      - name: Test (feature permissive)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F permissive --test ints
      - name: Test (feature int128)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F int128 --test ints
      - name: Test (feature int128_xdr)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F int128_xdr --test ints
      - name: Test (workspace with additive features)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --workspace -F "alloc,derive,repr,xdr_common,ns,int128"
      - name: Test (benchmarks)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F "alloc,derive,repr,xdr_common,ns,int128" --benches
      - name: Docs
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo doc -F "alloc,derive,repr,xdr_common,ns,int128"
      - name: Docs (docsrs)
        run: cargo +nightly doc -p xdrs -p xdr-repr -p xdr-derive -F "alloc,derive,repr,xdr_common,ns,int128" --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
      - name: Test Documentation Examples
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc -p xdr-repr --features "derive,xdr_common,ns,int128_xdr"
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc --features "alloc,derive,repr,xdr_common,ns,int128"
