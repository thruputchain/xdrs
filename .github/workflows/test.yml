name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

jobs:
  stable:
    name: Rust 1.96
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@v5
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Check format
        run: cargo fmt --check
      - name: Build workspace (no features)
        run: cargo build --workspace
      - name: Test (root lib without alloc)
        run: cargo test -F int128
      - name: Test compact read errors
        run: |
          cargo test --no-default-features
          cargo test --no-default-features --features derive --test read_errors
      - name: Test (derive without alloc)
        # const writers for VecM/BytesM/StringM are only exercised with
        # non-empty static data in no-alloc builds
        run: cargo test -F derive,int128
      - name: Test (feature permissive)
        run: cargo test -F permissive,int128 --test ints
      - name: Test (feature int128)
        run: cargo test -F int128 --test ints
      - name: Test (workspace)
        run: cargo test --workspace --all-features
      - name: Test (benchmarks)
        run: cargo test --benches --all-features
      - name: Docs
        run: cargo doc --workspace --all-features
      - name: Test (xdr-common)
        run: |
          cargo test -p xdr-common --no-default-features
          cargo test -p xdr-common --features alloc
          cargo test -p xdr-common --features serde
          cargo test -p xdr-common --features schemars
      - name: Check clippy
        run: cargo clippy --all-features -p xdr-common -p xdr-repr -p xdr-derive -p xdrs
      - name: Test Documentation Examples
        run: |
          cargo test --doc -p xdr-repr --features "ns,int128"
          cargo test --doc --features "alloc,derive,repr,ns,int128"

  nightly:
    name: Nightly-only checks
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up pinned nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - name: Build xdr-common with build-std
        run: |
          cargo +nightly-2026-05-26 build -p xdr-common --no-default-features -Zbuild-std=core,alloc
          cargo +nightly-2026-05-26 build -p xdr-common --features alloc -Zbuild-std=core,alloc
      - name: Docs (docsrs)
        run: cargo +nightly-2026-05-26 doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs --deny warnings"

  stable-compat:
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@v5
      - name: Set up current stable
        uses: dtolnay/rust-toolchain@stable
      - name: Test workspace on current stable
        run: cargo +stable test --workspace --all-features
