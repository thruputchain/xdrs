name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rust-src, rustfmt, clippy
      - name: Check format
        run: cargo fmt --check
      - name: Build workspace (no features)
        run: cargo build --workspace
      - name: Test (root lib without alloc)
        run: cargo test -F int128
      - name: Check (riscv32 no-std, derive)
        # 32-bit no-std target: catches usize-overflow in const MAX folds (rv32 is the primary consumer)
        run: |
          rustup target add riscv32im-unknown-none-elf
          cargo check --target riscv32im-unknown-none-elf -F derive,int128
      - name: Test (derive without alloc)
        run: cargo test -F derive,int128
      - name: Test (feature permissive)
        run: cargo test -F permissive,int128 --test ints
      - name: Test (feature int128)
        run: cargo test -F int128 --test ints
      - name: Test (workspace)
        run: cargo test --workspace --all-features
      - name: Test (benchmarks)
        run: cargo test --benches --all-features
      - name: Docs
        run: cargo doc --workspace --all-features
      - name: Docs (docsrs)
        run: cargo +nightly doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
      - name: Test (xdr-common)
        run: |
          cargo test -p xdr-common --no-default-features
          cargo test -p xdr-common --features alloc
          cargo test -p xdr-common --features std
          cargo test -p xdr-common --features alloc,std
          cargo test -p xdr-common --features serde
          cargo test -p xdr-common --features serde,std
      - name: Build (xdr-common, build-std)
        # Make sure that we can build std, i.e. for wasm contracts
        run: |
          cargo +nightly build -p xdr-common --no-default-features -Zbuild-std=core,alloc
          cargo +nightly build -p xdr-common --features alloc -Zbuild-std=core,alloc

      - name: Check clippy
        run: cargo clippy --all-features -p xdr-common -p xdr-repr -p xdr-derive -p xdrs
      - name: Test Documentation Examples
        run: |
          cargo test --doc -p xdr-repr --features "ns,int128"
          cargo test --doc --features "alloc,derive,repr,ns,int128"
