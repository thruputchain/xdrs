name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
      - name: Test (No Features)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --workspace
      - name: Test (All Features)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --workspace --all-features
      - name: Test (alloc,derive)
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F alloc,derive --workspace
      - name: Test Benches
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -F extras,alloc,derive --benches
      - name: Test xdr-repr crate
        run: CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test -p xdr-repr --all-features
      - name: Build Documentation
        run: cargo +nightly doc --all-features -p xdrs -p xdr-repr -p xdr-derive --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
      - name: Test Documentation Examples
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc -p xdr-repr --all-features
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo test --doc --all-features
