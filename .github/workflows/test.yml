name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

# Least privilege for the build/test jobs; the two jobs that call shared
# reusable workflows narrow it further themselves.
permissions:
  contents: read

jobs:
  # Audit Rust dependencies
  dependency-policy:
    # (No registry credentials here: every dependency comes from crates.io.)
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6

  # Lint this repo's workflows
  workflow-lint:
    permissions:
      contents: read
    uses: thruputchain/actions/.github/workflows/workflow-lint.yml@c2827cac0ab8b51c5a3ef119b2c1c854dffa5ae6
    with:
      lint-app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
    secrets:
      lint-app-private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}

  stable:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Rust 1.96
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
          targets: thumbv7em-none-eabi,riscv32imac-unknown-none-elf
      - name: Check format
        run: cargo fmt --check
      - name: Build workspace (no features)
        run: cargo build --locked --workspace
      - name: Test (root lib without alloc)
        run: cargo test --locked -F int128
      - name: Test compact read errors
        run: |
          cargo test --locked --no-default-features
          cargo test --locked --no-default-features --features derive --test read_errors
      - name: Test (derive without alloc)
        # const writers for VecM/BytesM/StringM are only exercised with
        # non-empty static data in no-alloc builds
        run: cargo test --locked -F derive,int128
      - name: Test (feature permissive)
        run: cargo test --locked -F permissive,int128 --test ints
      - name: Test (feature int128)
        run: cargo test --locked -F int128 --test ints
      - name: Test (workspace)
        run: cargo test --locked --workspace --all-features
      - name: Test (benchmarks)
        run: cargo test --locked --benches --all-features
      - name: Docs
        run: cargo doc --locked --workspace --all-features
      - name: Test (xdr-common)
        run: |
          cargo test --locked -p thruput-xdr-common --no-default-features
          cargo test --locked -p thruput-xdr-common --features alloc
          cargo test --locked -p thruput-xdr-common --features serde
          cargo test --locked -p thruput-xdr-common --features schemars
      - name: Check xdr-common Serde without std
        run: cargo check --locked -p thruput-xdr-common --no-default-features --features serde --target thumbv7em-none-eabi
      - name: Check RV32 without std
        run: cargo check --locked -p thruput-xdrs --no-default-features --features derive,int128 --target riscv32imac-unknown-none-elf
      - name: Check clippy
        run: cargo clippy --locked --all-features -p thruput-xdr-common -p thruput-xdr-repr -p thruput-xdr-derive -p thruput-xdrs
      - name: Check clippy (RPC crates)
        run: >-
          cargo clippy --all-targets --locked
          -p thruput-rpc-api -p thruput-rpc-driver -p rpc-smoke -p rpc-api-fixture -p bench-compare
          -- -D warnings
      # A consumer must never end up with two incompatible copies of the RPC
      # boundary crates in one build — that is exactly the type-identity
      # split rpc_api exists to prevent (see "Versioning and releases" in
      # rpc/README.md).
      - name: Check for duplicate RPC boundary crates
        run: |
          DUPES=$(cargo tree --workspace --duplicates --edges normal --locked | grep -E '^(thruput-rpc-api|thruput-rpc-driver|thruput-xdrs) v' || true)
          if [ -n "$DUPES" ]; then
            echo "::error::Duplicate RPC boundary crates in the dependency graph:"
            echo "$DUPES"
            cargo tree --workspace --duplicates --edges normal --locked
            exit 1
          fi
          echo "OK: no duplicate thruput-rpc-api/thruput-rpc-driver/thruput-xdrs in the graph"
      - name: Test Documentation Examples
        run: |
          cargo test --locked --doc -p thruput-xdr-repr --features "ns,int128"
          cargo test --locked --doc --features "alloc,derive,repr,ns,int128"

  nightly:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Nightly-only checks
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned nightly
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - name: Build xdr-common with build-std
        run: |
          cargo +nightly-2026-05-26 build --locked -p thruput-xdr-common --no-default-features -Zbuild-std=core,alloc
          cargo +nightly-2026-05-26 build --locked -p thruput-xdr-common --features alloc -Zbuild-std=core,alloc
      - name: Docs (docsrs)
        run: cargo +nightly-2026-05-26 doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs --deny warnings"

  rv32-size:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: RV32 size probe
    runs-on: ubuntu-latest
    # No RUSTFLAGS here: it would replace rv32-size-test's SDK target
    # rustflags, which already deny warnings.
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build with the thruput-sdk-rs rv32 config
        run: |
          set -o pipefail
          bash scripts/rv32-size.sh | tee "$RUNNER_TEMP/rv32-size.txt"
          tail -n 1 "$RUNNER_TEMP/rv32-size.txt" >> "$GITHUB_STEP_SUMMARY"

  stable-compat:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up current stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Test workspace on current stable
        run: cargo +stable test --locked --workspace --all-features
