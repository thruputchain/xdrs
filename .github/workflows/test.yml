name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 7 * * 1'

# Least privilege for the build/test jobs; the two jobs that call shared
# reusable workflows narrow it further themselves.
permissions:
  contents: read

jobs:
  # Audit Rust dependencies
  dependency-policy:
    # (No registry credentials here: this repo publishes to the private registry
    # but depends on nothing from it, so the graph resolves unauthenticated.)
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/rust-dependency-policy.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51

  # Lint this repo's workflows
  workflow-lint:
    permissions:
      contents: read
    uses: groundhogchain/actions/.github/workflows/workflow-lint.yml@2c5fd2d95a58f11da1e362b08c57a08fb7dfec51
    with:
      # zizmor cannot audit this repo from CI: the workflows above reference
      # the private groundhogchain/actions cross-repo, and zizmor's
      # impostor-commit and ref-confusion audits read that repo's refs over
      # git, which a consumer's github.token cannot do.  For now, run
      # zizmor before pushing.
      run-zizmor: false

  stable:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Rust 1.96
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.XDRS_TO_XDR_COMMON_ACCESS_KEY }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Rust 1.96.0
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Check format
        run: cargo fmt --check
      - name: Build workspace (no features)
        run: cargo build --workspace
      - name: Test (root lib without alloc)
        run: cargo test -F int128
      - name: Test compact read errors
        run: |
          cargo test --no-default-features
          cargo test --no-default-features --features derive --test read_errors
      - name: Test (derive without alloc)
        # const writers for VecM/BytesM/StringM are only exercised with
        # non-empty static data in no-alloc builds
        run: cargo test -F derive,int128
      - name: Test (feature permissive)
        run: cargo test -F permissive,int128 --test ints
      - name: Test (feature int128)
        run: cargo test -F int128 --test ints
      - name: Test (workspace)
        run: cargo test --workspace --all-features
      - name: Test (benchmarks)
        run: cargo test --benches --all-features
      - name: Docs
        run: cargo doc --workspace --all-features
      - name: Test (xdr-common)
        run: |
          cargo test -p xdr-common --no-default-features
          cargo test -p xdr-common --features alloc
          cargo test -p xdr-common --features serde
          cargo test -p xdr-common --features schemars
      - name: Check clippy
        run: cargo clippy --all-features -p xdr-common -p xdr-repr -p xdr-derive -p xdrs
      - name: Test Documentation Examples
        run: |
          cargo test --doc -p xdr-repr --features "ns,int128"
          cargo test --doc --features "alloc,derive,repr,ns,int128"

  nightly:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Nightly-only checks
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up pinned nightly
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: nightly-2026-05-26
          components: rust-src
      - name: Build xdr-common with build-std
        run: |
          cargo +nightly-2026-05-26 build -p xdr-common --no-default-features -Zbuild-std=core,alloc
          cargo +nightly-2026-05-26 build -p xdr-common --features alloc -Zbuild-std=core,alloc
      - name: Docs (docsrs)
        run: cargo +nightly-2026-05-26 doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs --deny warnings"

  stable-compat:
    needs: dependency-policy # don't build anything until deps are known to be clean
    name: Current stable compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "--deny warnings"
      RUSTDOCFLAGS: "--deny warnings"
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up current stable
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Test workspace on current stable
        run: cargo +stable test --workspace --all-features
