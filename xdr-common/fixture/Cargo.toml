[package]
name = "xdr-common-fixture"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Consumer fixture proving derived XDR types need only xdr-common, not the xdrs codecs"

# The lib target mimics generated protocol types and must depend on
# xdr-common (with its derive macros) ONLY. Adding thruput-xdrs to [dependencies] defeats the fixture's purpose:
# it is what proves that everything derived code names lives in the stable
# crate, so a codec release can't change these types' public API. The
# integration tests encode and decode through the real codecs via
# [dev-dependencies].
[dependencies]
xdr-common = { workspace = true, features = ["alloc", "derive"] }

[dev-dependencies]
xdrs = { workspace = true, features = ["alloc"] }

[lints]
workspace = true
