[package]
name = "thruput-xdr-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["encoding", "no-std", "no-std::no-alloc"]

[lib]
name = "xdr_common"
crate-type = ["rlib"]
doctest = false

[features]
alloc = ["escape-bytes/alloc"]
serde = ["alloc", "dep:serde"]
schemars = ["alloc", "dep:schemars"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
escape-bytes = { version = "0.1.1", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive"], optional = true }
schemars = { version = "1.2.0", optional = true }

[dev-dependencies]
regex-lite = "0.1.9"
serde_json = "1.0.149"
