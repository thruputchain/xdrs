[package]
name = "xdr-repr"
description = "Representations of XDR specs"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
xdr_common = { workspace = true, optional = true }
xdr-derive = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["derive"]
derive = ["dep:xdr-derive"]
xdr_common = ["dep:xdr_common"]

[dev-dependencies]
pretty_assertions = "1.4.1"
