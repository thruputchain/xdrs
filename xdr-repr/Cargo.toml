[package]
name = "xdr-repr"
description = "Representations of XDR specs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = true

[dependencies]
xdr-derive = { workspace = true, optional = true }
xdr-common = { workspace = true }

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
derive = ["dep:xdr-derive"] # derive the XDR trait
ns = [] # C++-like namespaces for XDR specs
int128_xdr = []

[dev-dependencies]
pretty_assertions = { workspace = true }
xdrs = { path = "..", features = ["repr", "derive"] }

[[test]]
name = "ns"
required-features = ["ns"]
