[package]
name = "xdr-repr"
description = "Representations of XDR specs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = true

[dependencies]
xdr-common = { workspace = true }
heapless = { workspace = true, optional = true }

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
heapless = ["dep:heapless"] # schema traits for types from the `heapless` package
ns = [] # C++-like namespaces for XDR specs
int128 = []

[dev-dependencies]
pretty_assertions = { workspace = true }
xdrs = { path = "..", features = ["repr", "derive"] }
serde_json = "=1.0.149"

[[test]]
name = "ns"
required-features = ["ns"]
